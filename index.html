<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyncalco | Elite Creator Brand Deal & RPM Valuation Engine</title>
    <meta name="description" content="Instant multi-platform programmatic calculator tracking Tier 1 sponsorship rates and ad monetization metrics.">
    <style>
        /* High-Velocity Native Styling Matrix — Zero Network Request Architecture */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #090d16; 
            color: #f1f5f9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Structural Page Isolation Layouts */
        header { 
            background-color: #111726; 
            border-bottom: 1px solid #1e293b; 
            padding: 16px 32px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }

        .logo-group { display: flex; align-items: center; gap: 10px; }
        .logo-box { 
            background: #06b6d4; 
            color: #090d16; 
            font-weight: 800; 
            width: 34px; 
            height: 34px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 8px; 
            font-size: 18px; 
        }

        .logo-brand { font-size: 22px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; }
        .logo-cyan { color: #06b6d4; }
        
        .sys-badge { 
            background: rgba(6, 182, 212, 0.1); 
            color: #06b6d4; 
            border: 1px solid rgba(6, 182, 212, 0.2); 
            padding: 4px 12px; 
            border-radius: 16px; 
            font-size: 11px; 
            font-weight: 700; 
            text-transform: uppercase; 
        }

        /* AdSense Verification Node Placeholders */
        .ad-strip { max-width: 1140px; width: calc(100% - 32px); margin: 20px auto 0 auto; background: #111726; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; text-align: center; }
        .ad-placeholder { background: #090d16; border: 1px dashed #334155; min-height: 45px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #475569; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }

        /* Workspace Grid Matrix */
        .workspace { 
            max-width: 1140px; 
            width: 100%; 
            margin: 24px auto; 
            padding: 0 16px; 
            display: grid; 
            grid-template-columns: 2.2fr 1fr; 
            gap: 24px; 
            flex-grow: 1; 
        }

        @media (max-width: 920px) { .workspace { grid-template-columns: 1fr; } }

        /* Component Panels */
        .panel { background: #111726; border: 1px solid #1e293b; border-radius: 20px; padding: 28px; }
        .panel-heading { font-size: 24px; font-weight: 800; color: #ffffff; margin-bottom: 6px; letter-spacing: -0.5px; }
        .panel-desc { color: #94a3b8; font-size: 13px; margin-bottom: 24px; line-height: 1.4; }

        /* Two Column Calculator Core Split */
        .calc-core { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 600px) { .calc-core { grid-template-columns: 1fr; } }

        /* Input Element UI Controllers */
        .form-element { margin-bottom: 20px; }
        .form-label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; margin-bottom: 8px; letter-spacing: 0.5px; }
        
        select { 
            width: 100%; 
            background: #090d16; 
            border: 1px solid #1e293b; 
            padding: 12px; 
            border-radius: 10px; 
            color: #ffffff; 
            font-size: 13px; 
            font-weight: 600; 
            outline: none; 
        }
        select:focus { border-color: #06b6d4; }

        .slider-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .slider-counter { background: rgba(6, 182, 212, 0.1); color: #06b6d4; font-weight: 700; font-size: 12px; padding: 2px 6px; border-radius: 4px; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: #090d16; height: 6px; border-radius: 3px; outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #06b6d4; cursor: pointer; }

        /* Display Visual Module Outputs */
        .display-card { background: #090d16; border: 1px solid #1e293b; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .display-meta { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #64748b; margin-bottom: 2px; }
        .display-val { font-size: 34px; font-weight: 900; color: #34d399; margin-bottom: 16px; letter-spacing: -0.5px; }
        
        .row-metric { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; border-top: 1px solid #1e293b; padding-top: 14px; margin-bottom: 20px; }
        .sub-val { font-size: 15px; font-weight: 700; color: #ffffff; margin-top: 2px; }

        /* Dynamic Visual Bar Trackers */
        .track-wrapper { background: #111726; border: 1px solid #1e293b; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 4px; }
        .track-fill { height: 100%; background: #06b6d4; width: 65%; transition: width 0.15s ease-out; }

        /* Anti-Thin Content Legal Text Columns */
        .documentation-container { background: rgba(17, 23, 38, 0.5); border: 1px solid #1e293b; border-radius: 20px; padding: 24px; margin-top: 24px; color: #94a3b8; font-size: 13.5px; line-height: 1.5; }
        .documentation-container h2 { color: #ffffff; font-size: 16px; font-weight: 700; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #1e293b; }
        .documentation-container p { margin-bottom: 12px; }

        /* Sidebar Elements */
        .sidebar-panel { display: flex; flex-direction: column; gap: 24px; }
        .sidebar-ad { background: #111726; border: 1px solid #1e293b; border-radius: 16px; padding: 16px; text-align: center; }
        .sidebar-ad-box { background: #090d16; border: 1px dashed #334155; min-height: 250px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #475569; font-size: 10px; font-weight: 700; }
        
        .slab-container { background: rgba(17, 23, 38, 0.5); border: 1px solid #1e293b; border-radius: 16px; padding: 18px; }
        .slab-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 11.5px; font-weight: 600; }
        .slab-item:last-child { border: none; }
        .slab-key { color: #94a3b8; }
        .slab-val-text { color: #06b6d4; }

        footer { background: #06080e; border-top: 1px solid #111726; padding: 20px; text-align: center; color: #475569; font-size: 11px; font-weight: 600; }
    </style>
</head>
<body>

    <!-- Header Frame -->
    <header>
        <div class="logo-group">
            <div class="logo-box">L</div>
            <div class="logo-brand">lyn<span class="logo-cyan">calco</span></div>
        </div>
        <div class="sys-badge">Tier-1 Yield Engine</div>
    </header>

    <!-- Structural AdSense Module Allocation (Top Unit) -->
    <div class="ad-strip">
        <div class="ad-placeholder">[Automated Programmatic Ad Traffic Pipeline Interface Node]</div>
    </div>

    <!-- Active Workspace Module Grid Layout -->
    <main class="workspace">
        
        <!-- Left Side Primary Core App Layout -->
        <div>
            <div class="panel">
                <h1 class="panel-heading">Creator Value Forecasting Engine</h1>
                <p class="panel-desc">Automated mathematical matrix determining contract value standards and revenue metrics built across Tier 1 digital media vectors.</p>
                
                <div class="calc-core">
                    <!-- Dashboard System Form Fields -->
                    <div>
                        <div class="form-element">
                            <label class="form-label">Target Network Platform</label>
                            <select id="platform">
                                <option value="youtube">YouTube Hub (Premium Longform)</option>
                                <option value="vertical">TikTok / Shorts (Vertical Feed)</option>
                                <option value="twitch">Twitch Stream (Live Broadcast)</option>
                            </select>
                        </div>

                        <div class="form-element">
                            <div class="slider-meta">
                                <label class="form-label" style="margin:0;">Average Video Reach</label>
                                <span class="slider-counter" id="viewsDisplay">100,000</span>
                            </div>
                            <input type="range" id="viewsSlider" min="5000" max="1000000" step="5000" value="100000">
                        </div>

                        <div class="form-element">
                            <label class="form-label">Audience Demographic Core</label>
                            <select id="tierWeight">
                                <option value="1.65">United States / Canada (Premium Max RPM)</option>
                                <option value="1.35">United Kingdom / Australia Corridors</option>
                                <option value="1.00">North & Western Europe Profiles</option>
                            </select>
                        </div>
